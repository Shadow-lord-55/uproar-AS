<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Uproar AI</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#111827;
            color:white;
            line-height:1.6;
        }

        nav{
            background:#0f172a;
            padding:20px;
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:bold;
            transition:0.3s;
        }

        nav a:hover{
            color:#38bdf8;
        }

        main{
            min-height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px 20px;
        }

        .about-box{
            max-width:700px;
            background:#1f2937;
            padding:40px;
            border-radius:16px;
            text-align:center;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
        }

        h1{
            font-size:2.5rem;
            margin-bottom:20px;
            color:#38bdf8;
        }

        p{
            font-size:1.1rem;
            color:#d1d5db;
        }

        @media(max-width:600px){
            h1{
                font-size:2rem;
            }

            p{
                font-size:1rem;
            }
        }
.logo-footer{
    margin-top:60px;
    padding:30px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    background:#0b1220;
    border-top:1px solid #1f2937;
}

.logo-footer img{
    width:80px;
    height:auto;
    opacity:0.9;
    transition:0.3s;
}

.logo-footer img:hover{
    opacity:1;
    transform:scale(1.05);
}
    </style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="aboutuproar.html">About</a>
    <a href="servicesuproar.html">Services</a>
    <a href="contactuproar.html">Contact</a>
    <a href="SoMeuproar.html">SoMe</a>
</nav>

<main>
    <div class="about-box">
        <h1>About Us</h1>

        <p>
            Uproar AI creates smart and modern technology solutions.
            We help businesses with AI, websites, automation,
            and branding to grow faster in the digital world.
        </p>
    </div>
</main>
<footer class="logo-footer">
    <img src="ailogo.png.png" alt="Logo 1">
    <img src="image.png" alt="Logo 2">
</footer>
</body>
</html>
